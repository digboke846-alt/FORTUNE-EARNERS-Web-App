<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Login — Fortune Earners</title>
    
    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

    <body>

        <div class="container">
            <div class="auth-card">

    <h1>💎 FORTUNE <span>EARNERS</h1></span>

    <h2>Welcome Back!</h2>

    <p>Log into your Fortune Earners registered account to continue.</p><br>
                <form id="loginForm">

    <label for="email">Email or Username</label>

    <input type="text"
           id="email"
           name="email"
           placeholder="Enter your email or username">

    <br><br>

<div class="form-group" style="justify-spacing: space-between; align-items: center; gap: 90px";>
  <label for="password">🔑 Password</label> <p>
    <a href="forgot-password.html"><strong>Forgot Password?</strong></a>
    </p> </div>

                    <div class="password-wrapper">

    <input
        type="password"
        id="password"
        name="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required>

    <i
        class="fa-regular fa-eye-slash toggle-password"
        onclick="togglePassword('password', this)">
    </i>    
        </div>    

                    <div class="form-group" style="display: flex; align-items: center; gap: 8px; margin-top: -8px;">
    <input type="checkbox" id="rememberMe" style="width: 18px; height: 18px; cursor: pointer;">
    <label for="rememberMe" style="cursor: pointer; font-size: 14px;">Remember me</label>
                    </div>      

    <br>

<button type="submit">Log In</button>
<p>
    Don't have an account yet?
    <a href="signup.html"><strong>Sign Up</strong></a>
</p>
                        
            <script>
                function togglePassword(inputId, icon){

    const input =
        document.getElementById(inputId);

    if(input.type === "password"){

        input.type = "text";

        icon.classList.remove("fa-eye-slash");

        icon.classList.add("fa-eye");

        icon.style.color = "#FFD700";

    }else{

        input.type = "password";

        icon.classList.remove("fa-eye");

        icon.classList.add("fa-eye-slash");

        icon.style.color = "#AFAFAF";

    }

                }
            </script>

         </div>

        </div>

            <br><br>

            <div class="container">

<footer>
  <p class="copyright">
    &copy; 2026 Fortune Earners. All Rights Reserved.
  </p>
</footer> </div>
      
        </form>
    <script type="module" src="js/firebase.js"></script>
<script type="module" src="js/login.js"></script>
</body>
</html>
