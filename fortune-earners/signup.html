<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Fortune Earners - Earn money through referrals, daily tasks and sponsored ads.">

    <title>Sign Up | Fortune Earners</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    
</head>

<body>

<div class="container">

<h1>FORTUNE EARNERS</h1>

<h2>Create Your Account</h2>

<p>Join Fortune Earners today and start your earning journey.</p><br>

<form id="signupForm">

    <label for="fullname">Full Name</label>

    <input
        type="text"
        id="fullname"
        name="fullname"
        placeholder="Enter your full name"
        autocomplete="name"
        required>

    <br>

    <label for="username">Username</label>

    <input
        type="text"
        id="username"
        name="username"
        placeholder="Choose a username"
        autocomplete="username"
        required>

    <br>

    <label for="email">Email Address</label>

    <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your email address"
        autocomplete="email"
        required>

    <br>

    <label for="phone">Phone Number</label>

    <input
        type="tel"
        id="phone"
        name="phone"
        placeholder="Enter your phone number"
        autocomplete="tel"
        required>

    <label for="referredBy">Referred By (Optional)</label>

    <input
        type="text"
        id="referredBy"
        name="referredBy"
        placeholder="Referred by username or code (Optional)">

    <br>
    
    <h3 class="security-title">🔐 Security</h3>
    
    <label for="password">🔑 Password</label>

<div class="password-wrapper">

    <input
        type="password"
        id="password"
        name="password"
        placeholder="Create a password with at least 6 characters"
        autocomplete="new-password"
        required>

    <i
        class="fa-regular fa-eye-slash toggle-password"
        onclick="togglePassword('password', this)">
    </i>

</div>

<br>

<label for="confirmPassword">Confirm Password</label>

<div class="password-wrapper">

    <input
        type="password"
        id="confirmPassword"
        name="confirmPassword"
        placeholder="Confirm your password"
        autocomplete="new-password"
        required>

    <i
        class="fa-regular fa-eye-slash toggle-password"
        onclick="togglePassword('confirmPassword', this)">
    </i>

</div>
    
    <br>

    <input
        type="checkbox"
        id="terms"
        name="terms"
        required>
    <label for="terms">
        By registering, I agree to the
        <a href="terms.html">Terms & Conditions</a>
        and
        <a href="privacy.html">Privacy Policy</a>.
    </label>

    <br>

    <button type="submit">Create Account</button>

    <p>
        Already have an account?
        <a href="login.html">Log In</a>
    </p>

    <script>
function togglePassword(inputId, icon){

    const input =
        document.getElementById(inputId);

    if(input.type === "password"){

        input.type = "text";

        icon.classList.remove("fa-eye-slash");

        icon.classList.add("fa-eye");

        icon.style.color = "#FFD700";

    }else{

        input.type = "password";

        icon.classList.remove("fa-eye");

        icon.classList.add("fa-eye-slash");

        icon.style.color = "#AFAFAF";

    }

}
    </script>

    <br><br>
<hr>

<!-- FOOTER -->
<!-- ===================== -->

  <div class="footer-links">
    <a href="terms.html">Terms & Conditions</a>
    <span class="divider">|</span>
    <a href="privacy.html">Privacy Policy</a>
    <span class="divider">|</span>
    <span class="help-text">Need Help? <a href="contact.html">Contact Support</a></span>
  </div>

  <p class="copyright">
    &copy; 2026 Fortune Earners. All Rights Reserved.
  </p>
</footer>
    
    <br><br>
    
</form>

</div>

<script type="module" src="js/firebase.js"></script>
<script type="module" src="js/auth.js"></script>

</body>
</html>
