<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Fortune Earners - Earn money through referrals, daily tasks and sponsored ads.">

    <title>Sign Up | Fortune Earners</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container">

<h1>FORTUNE EARNERS</h1>

<h2>Create Your Account</h2>

<p>Join Fortune Earners today and start your earning journey.</p>

<form id="signupForm">

    <label for="fullname">Full Name</label><br>

    <input
        type="text"
        id="fullname"
        name="fullname"
        placeholder="Enter your full name"
        autocomplete="name"
        required>

    <br><br>

    <label for="username">Username</label><br>

    <input
        type="text"
        id="username"
        name="username"
        placeholder="Choose a username"
        autocomplete="username"
        required>

    <br><br>

    <label for="email">Email Address</label><br>

    <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your email address"
        autocomplete="email"
        required>

    <br><br>

    <label for="phone">Phone Number</label><br>

    <input
        type="tel"
        id="phone"
        name="phone"
        placeholder="Enter your phone number"
        autocomplete="tel"
        required>

    <br><br>

    <label for="password">Password</label><br>

    <div class="pass-wrapper">
    <input
        type="password"
        id="password"
        name="password"
        placeholder="Create a password"
        autocomplete="new-password"
        required>
    <button type="button" class="toggle-pass" onclick="toggleVisibility('password', this)" aria-label="Show password">
        <!-- Open Eye SVG -->
        <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
    </button>
</div>

<br><br>

<label for="confirmPassword">Confirm Password</label><br>

<div class="pass-wrapper">
    <input
        type="password"
        id="confirmPassword"
        name="confirmPassword"
        placeholder="Confirm your password"
        autocomplete="new-password"
        required>
    <button type="button" class="toggle-pass" onclick="toggleVisibility('confirmPassword', this)" aria-label="Show password">
        <!-- Open Eye SVG -->
        <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
    </button>
</div>
    

    <br><br>

    <label for="referredBy">Referred By (Optional)</label><br>

    <input
        type="text"
        id="referredBy"
        name="referredBy"
        placeholder="Referred by username or code (Optional)">

    <br><br>

    <input
        type="checkbox"
        id="terms"
        name="terms"
        required>

    <label for="terms">
        I agree to the
        <a href="terms.html">Terms & Conditions</a>
        and
        <a href="privacy.html">Privacy Policy</a>.
    </label>

    <br><br>

    <button type="submit">Create Account</button>

    <p>
        Already have an account?
        <a href="login.html">Log In</a>
    </p>

    <script>
function toggleVisibility(inputId, buttonEl) {
    const input = document.getElementById(inputId);
    
    // SVG strings for look switches
    const openEyeSVG = `<svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
    const slashedEyeSVG = `<svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;

    if (input.type === "password") {
        input.type = "text";
        buttonEl.innerHTML = slashedEyeSVG;
        buttonEl.setAttribute("aria-label", "Hide password");
    } else {
        input.type = "password";
        buttonEl.innerHTML = openEyeSVG;
        buttonEl.setAttribute("aria-label", "Show password");
    }
}
    </script>
    
    
</form>

</div>

<script type="module" src="js/firebase.js"></script>
<script type="module" src="js/auth.js"></script>

</body>
</html>
